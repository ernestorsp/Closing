/* Professional UI refresh */
:root{--navy:#123754;--navy-2:#0e2b43;--teal:#188f9c;--teal-dark:#11727d;--bg:#f2f5f7;--surface:#ffffff;--surface-soft:#f8fafb;--line:#d7e0e5;--line-strong:#c5d1d8;--text:#172b38;--muted:#647681;--green:#16764a;--orange:#a96508;--red:#b52c31;--shadow-sm:0 2px 8px rgba(17,43,60,.06);--shadow-md:0 10px 28px rgba(17,43,60,.09)}
html{background:var(--bg)}
body{min-height:100vh;background:linear-gradient(180deg,#edf2f5 0,#f7f9fa 230px,var(--bg) 520px);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:-.006em}
button,input,select,textarea{font-family:inherit}
button{transition:transform .12s ease,box-shadow .18s ease,background-color .18s ease,border-color .18s ease}
button:not(:disabled):active{transform:translateY(1px)}
header{min-height:72px;padding:13px 22px;border-bottom:1px solid #ffffff20;background:linear-gradient(135deg,var(--navy-2),var(--navy));box-shadow:0 5px 22px #0b2c4430}
header>div{gap:3px}
header b{font-size:20px;letter-spacing:.1px}
header small{max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d1e0e7;opacity:.92}
header .station{padding:0 2px;color:#dbe8ed;font-weight:700}
header .station select{border-color:#ffffff35;background:#ffffff12;color:#fff;font-weight:800;box-shadow:none}
header .station select option{color:var(--text);background:#fff}
.headerSync,.ghost{border:1px solid #ffffff30;background:#ffffff0f;box-shadow:none}
.headerSync:hover,.ghost:hover{background:#ffffff1c;border-color:#ffffff50}
.languagePicker{display:flex!important;grid-auto-flow:column;gap:4px;min-width:0;margin-left:auto;padding:4px;border:1px solid #ffffff2d;border-radius:12px;background:#ffffff0d}
.languagePicker button{display:flex;align-items:center;gap:4px;min-width:54px;padding:7px 9px;border:0;border-radius:8px;background:transparent;color:#dce8ed;font-size:17px;font-weight:900}
.languagePicker button span{font-size:10px;letter-spacing:.04em}
.languagePicker button.active{background:#fff;color:var(--navy);box-shadow:0 3px 10px #07172430}
header .languagePicker+.station{margin-left:0}
nav{top:72px;padding:0 12px;border-bottom:1px solid var(--line);background:#ffffffee;box-shadow:0 4px 16px #173f5f0b;backdrop-filter:blur(12px)}
nav button{position:relative;padding:16px 18px;border-bottom:0;color:#657782;font-size:13px;letter-spacing:.15px}
nav button::after{content:"";position:absolute;right:18px;bottom:7px;left:18px;height:3px;border-radius:999px;background:transparent}
nav button:hover{color:var(--navy);background:#f5f8f9}
nav button.active{color:var(--navy);background:transparent}
nav button.active::after{background:var(--teal)}
main{max-width:1140px;padding:28px 24px 42px}
.page.active{animation:pageIn .2s ease-out}
@keyframes pageIn{from{opacity:.25;transform:translateY(4px)}to{opacity:1;transform:none}}
.panel{border-color:var(--line);border-radius:15px;background:var(--surface);box-shadow:var(--shadow-sm)}
.sectionTitle{margin:30px 0 14px}
.sectionTitle h2{color:var(--navy);font-size:24px;letter-spacing:-.35px}
.sectionTitle h3{color:var(--navy)}
.sectionTitle p,.meta{color:var(--muted)}
label{color:#2d4655;font-size:13px;letter-spacing:.08px}
input,select,textarea{border-color:var(--line-strong);border-radius:10px;background:#fff;box-shadow:inset 0 1px 2px rgba(13,42,59,.025);transition:border-color .18s ease,box-shadow .18s ease,background .18s ease}
input:hover,select:hover,textarea:hover{border-color:#aebfc8}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(24,143,156,.13)}
input::placeholder,textarea::placeholder{color:#93a2aa}
.primary,.secondary,.ghost,.back{min-height:43px;border-radius:10px;letter-spacing:.12px}
.primary{background:linear-gradient(180deg,#1a99a6,var(--teal-dark));box-shadow:0 5px 14px rgba(24,143,156,.20)}
.primary:not(:disabled):hover{box-shadow:0 7px 18px rgba(24,143,156,.27)}
.secondary{background:linear-gradient(180deg,#174866,var(--navy));box-shadow:0 4px 12px rgba(18,55,84,.16)}
.back{border:1px solid var(--line);background:#fff;box-shadow:var(--shadow-sm)}
.cards{gap:12px}
.card{border-color:var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow-sm);transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
.card:hover{border-color:#c2d1d8;box-shadow:0 8px 22px rgba(17,43,60,.09)}
.card h3{color:var(--navy)}
.vanIcon{border:1px solid #d8e9eb;background:#edf7f7}
.badge{border:1px solid transparent}
.badge.good{border-color:#c8e8d6}
.badge.warn{border-color:#f1d9b7}
.badge.bad{border-color:#efc9c9}
.closingChecklist{gap:14px}
