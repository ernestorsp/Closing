const UI_TEXT_STATE=new WeakMap(),UI_ATTR_STATE=new WeakMap();
function translateUiText(value){const raw=String(value??''),trim=raw.trim();if(APP_LANGUAGE!=='es'||!trim)return raw;let out=UI_ES[trim]||trim;out=out.replace(/^(\d+) pending at (DJX[34])$/,'$1 pendientes en $2').replace(/^(\d+) vans are still waiting for inspection\./,'Todavía quedan $1 vans por inspeccionar.').replace(/^Progress check: (\d+) of (\d+) vans inspected\. Only (\d+) left/,'Progreso: $1 de $2 vans inspeccionadas. Solo faltan $3').replace(/^There are (\d+) vans left\./,'Quedan $1 vans.').replace(/^(\d+) vans remain\./,'Quedan $1 vans.').replace(/^Only (\d+) vans left!/,'¡Solo quedan $1 vans!').replace(/^It’s after 8 PM and only (\d+) vans are inspected\./,'Son más de las 8 PM y solo hay $1 vans inspeccionadas.').replace(/^Clock check: after 8 PM, (\d+) inspections\./,'Revisión de hora: después de las 8 PM, $1 inspecciones.').replace(/^The vans asked if tonight is a holiday\. We have (\d+) inspected so far/,'Las vans preguntaron si hoy es feriado. Llevamos $1 inspeccionadas').replace(/^Hey ([^!]+)! Closing Buddy is ready at (DJX[34])\./,'¡Hola $1! Closing Buddy está listo en $2.').replace(/^Started /,'Iniciada ').replace(/ completed$/,' completadas').replace(/^Ready · /,'Listo · ').replace(/^Waiting for /,'Esperando ').replace(/^No matching /,'No hay coincidencias para ').replace(/^No /,'Sin ').replace(/^Select /,'Seleccionar ').replace(/^Loading /,'Cargando ').replace(/^Last inspection: /,'Última inspección: ').replace(/^Move this van from /,'Mover esta van de ').replace(/^This van is /,'Esta van está ').replace(/^Message accepted\./,'Mensaje aceptado.').replace(/^Another user already accepted this message\./,'Otro usuario ya aceptó este mensaje.');return raw.replace(trim,out)}
function translateNode(node){const current=node.nodeValue||'',prior=UI_TEXT_STATE.get(node);let source=prior&&current===prior.rendered?prior.source:current;const rendered=translateUiText(source);UI_TEXT_STATE.set(node,{source,rendered});if(current!==rendered)node.nodeValue=rendered}
function translateAttribute(el,name){const current=el.getAttribute(name);if(current==null)return;const all=UI_ATTR_STATE.get(el)||{},prior=all[name],source=prior&&current===prior.rendered?prior.source:current,rendered=translateUiText(source);all[name]={source,rendered};UI_ATTR_STATE.set(el,all);if(current!==rendered)el.setAttribute(name,rendered)}
function translateRoot(root){if(!root)return;root.querySelectorAll('option').forEach(x=>{if(!x.hasAttribute('data-storage-value')){x.setAttribute('data-storage-value',x.value);x.setAttribute('value',x.value)}});const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode())translateNode(node);root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>['placeholder','title','aria-label'].forEach(name=>translateAttribute(el,name)))}
function translateApp(){document.documentElement.lang=APP_LANGUAGE;document.getElementById('langEn')?.classList.toggle('active',APP_LANGUAGE==='en');document.getElementById('langEs')?.classList.toggle('active',APP_LANGUAGE==='es');['auth','app','sessionLoading','photoModal'].forEach(id=>translateRoot(document.getElementById(id)))}
function queueTranslation(){if(I18N_PENDING)return;I18N_PENDING=true;setTimeout(()=>{I18N_PENDING=false;translateApp()},0)}
function startLanguageObserver(){if(I18N_OBSERVER)return;I18N_OBSERVER=new MutationObserver(queueTranslation);I18N_OBSERVER.observe(document.getElementById('app'),{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['placeholder','title','aria-label']});queueTranslation()}

function requestParentToken(){if(!APP_BOOTED&&window.top!==window)window.top.postMessage({type:'aaxi-closing-token-request'},'*')}
function receiveParentMessage(event){if(event.data&&event.data.type==='aaxi-closing-token-response'&&!APP_BOOTED){TOKEN=String(event.data.token||TOKEN||'');if(TOKEN)localStorage.setItem('closing_token',TOKEN);bootApp()}}
function bootApp(){if(APP_BOOTED)return;APP_BOOTED=true;if(window.CLOSING_ENTRY&&CLOSING_ENTRY.mode==='invite')showAuthForm('inviteForm');else if(TOKEN)loadApp();else showAuth()}

function moveDriverCaretToEnd(event){const input=event.target;if(!input.matches||!input.matches('input.driverFilter'))return;requestAnimationFrame(()=>{const end=input.value.length;try{input.setSelectionRange(end,end)}catch(e){}})}
function cacheDay(v){const d=new Date(v||Date.now());return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function readAppCache(){try{const saved=JSON.parse(localStorage.getItem(APP_CACHE_KEY)||'null');if(!saved||!saved.data||!saved.data.user||cacheDay(saved.savedAt)!==cacheDay())return null;return saved.data}catch(e){localStorage.removeItem(APP_CACHE_KEY);return null}}
function saveAppCache(data){try{localStorage.setItem(APP_CACHE_KEY,JSON.stringify({savedAt:Date.now(),data}))}catch(e){}}
function applyAppData(d){DATA=d;restoreRescueDraft();restoreClosingDraft();document.getElementById('auth').style.display='none';document.getElementById('app').hidden=false;document.getElementById('userName').textContent=d.user.name+' · '+d.user.email;renderAccess();document.getElementById('station').innerHTML=(d.user.allowedStations||['DJX3','DJX4']).map(x=>'<option>'+esc(x)+'</option>').join('');document.getElementById('station').value=d.user.station;renderAll();startMascotSystem();if((DATA.avatarMessages||[]).length)setTimeout(showPendingAvatarMessage,120);showSessionLoading(false);notifyAppReady()}
function loadApp(){const cached=readAppCache();if(cached)applyAppData(cached);else showSessionLoading(true);syncAppData(false,!cached)}
function setSyncState(syncing){SYNCING=syncing;const b=document.getElementById('syncButton');if(!b)return;b.disabled=syncing;b.classList.toggle('syncing',syncing);b.querySelector('.syncLabel').textContent=syncing?'Syncing…':'Sync'}
function syncAppData(manual,blocking,force){if(SYNCING&&!blocking)return;if(!blocking)setSyncState(true);google.script.run.withSuccessHandler(d=>{saveAppCache(d);applyAppData(d);setSyncState(false);if(manual)toast('Everything is synchronized.')}).withFailureHandler(e=>{setSyncState(false);showSessionLoading(false);const message=e.message||String(e);if(message.includes('AUTH_REQUIRED')){localStorage.removeItem(APP_CACHE_KEY);authFail(e)}else toast(readAppCache()?'Could not synchronize. Showing the saved data.':message,true)}).getAppData(TOKEN,!!manual||!!force)}
function manualSync(){syncAppData(true,false)}

 const rows=AVATAR_ADMIN_DATA.messages||[];box.innerHTML=rows.map(x=>'<article class="avatarAdminCard"><div><span class="avatarAudience">'+esc(x.station==='ALL'?'All stations':x.station)+'</span><strong>'+esc(x.createdByName||'Admin')+'</strong></div><p>'+esc(x.text)+'</p><footer><span>'+fmt(x.createdAt)+'</span><b>✓ '+Number(x.ackCount||0)+' read</b></footer></article>').join('')||empty('No avatar messages have been sent yet.');
}
function sendAvatarAdminMessage(event){
 event.preventDefault();const formEl=event.target,input=form(formEl),button=formEl.querySelector('button.primary'),label=button.textContent;input.language=APP_LANGUAGE;button.disabled=true;button.textContent='SENDING…';
 google.script.run.withSuccessHandler(r=>{button.disabled=false;button.textContent=label;formEl.reset();AVATAR_ADMIN_DATA=r.data;renderAvatarAdminData();toast(r.message||'Message sent.')}).withFailureHandler(e=>{button.disabled=false;button.textContent=label;toast(e.message||String(e),true)}).sendAvatarMessage(TOKEN,input);
}
function showPage(id){if(['history','update','avatar'].includes(id)&&!(DATA.user&&DATA.user.isAdmin))return toast('Admin permission required.',true);document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));if(id==='history'){document.getElementById('historyList').innerHTML='';renderHistoryVans()}if(id==='update')loadAdminData();if(id==='avatar')loadAvatarAdminData();if((DATA.avatarMessages||[]).length)setTimeout(showPendingAvatarMessage,100)}
function closeModal(e){if(e&&e.target!==document.getElementById('photoModal'))return;document.getElementById('photoModal').hidden=true;document.getElementById('previousImage').src=''}
function doLogout(){const t=TOKEN;TOKEN='';saveSessionToken('');localStorage.removeItem(APP_CACHE_KEY);clearInterval(MASCOT_TIMER);clearInterval(MASCOT_POLL_TIMER);clearTimeout(MASCOT_HIDE_TIMER);MASCOT_TIMER=MASCOT_POLL_TIMER=MASCOT_HIDE_TIMER=null;MASCOT_STARTED=false;MASCOT_CURRENT=null;const mascot=document.getElementById('homeMascot');if(mascot)mascot.hidden=true;google.script.run.logout(t);document.getElementById('app').hidden=true;showAuth()}
function showAuth(){showSessionLoading(false);showAuthForm('loginForm');document.getElementById('app').hidden=true;notifyAppReady()}
function showAuthForm(id){document.getElementById('auth').style.display='grid';['loginForm','forgotForm','resetForm','inviteForm','passwordForm'].forEach(x=>document.getElementById(x).hidden=x!==id)}
function showForgotPassword(){showAuthForm('forgotForm')}
function showLogin(){showAuthForm('loginForm')}
function showSessionLoading(show){const x=document.getElementById('sessionLoading');x.hidden=!show;if(show){document.getElementById('auth').style.display='none';document.getElementById('app').hidden=true}setBusy(show)}
function authFail(e){showSessionLoading(false);if(String(e.message||e).includes('AUTH_REQUIRED')){TOKEN='';saveSessionToken('');showAuth()}toast(e.message||String(e),true)}
function failBusy(e){setBusy(false);toast(e.message||String(e),true)}
function setBusy(v){busy=v;document.querySelectorAll('button,input,select,textarea').forEach(x=>x.disabled=v)}
function toast(m,error=false){const x=document.getElementById('toast');x.textContent=translateUiText(m);x.className=error?'error':'';x.style.display='block';setTimeout(()=>x.style.display='none',4000)}
function quickActionDelay(button,done,label='Saving…'){if(!button)return setTimeout(done,500);cancelQuickAction(button);const state={html:button.innerHTML,disabled:button.disabled,timer:null};button.disabled=true;button.innerHTML='<span class="spinner small buttonSpinner quickButtonSpinner"></span>'+(label?esc(label):'');state.timer=setTimeout(()=>{button._quickAction=null;done()},500);button._quickAction=state}
function cancelQuickAction(button){const state=button&&button._quickAction;if(!state)return;clearTimeout(state.timer);button.innerHTML=state.html;button.disabled=state.disabled;button._quickAction=null}
function loadAdminData(){if(ADMIN_LOADING||!DATA.user.isAdmin)return;ADMIN_LOADING=true;document.getElementById('adminUsers').innerHTML='<div class="historyLoading"><span class="spinner"></span> Loading users…</div>';google.script.run.withSuccessHandler(d=>{ADMIN_LOADING=false;ADMIN_DATA=d;renderAdminData()}).withFailureHandler(e=>{ADMIN_LOADING=false;document.getElementById('adminUsers').innerHTML='';toast(e.message||String(e),true)}).getAdminData(TOKEN)}
function renderAdminData(){const summary=document.getElementById('permissionSummary'),box=document.getElementById('adminUsers');summary.innerHTML=(ADMIN_DATA.permissions||[]).map(p=>'<article><b>'+esc(p.role)+'</b><span>'+esc(p.access)+'</span></article>').join('');box.innerHTML=(ADMIN_DATA.users||[]).map(userCard).join('')||empty('No users found.');renderImportUpdates()}
function importUpdateText(x){if(!x)return'No successful update recorded.';const who=x.name?(x.name+' · '+x.email):x.email;return'Last successful update: '+fmt(x.at)+' by '+who}
function renderImportUpdates(){if(!ADMIN_DATA)return;const station=document.getElementById('driverImportStation'),drivers=document.getElementById('driversLastUpdate'),vans=document.getElementById('vansLastUpdate'),updates=ADMIN_DATA.lastUpdates||{},driverUpdates=updates.drivers||{};if(drivers)drivers.textContent=importUpdateText(driverUpdates[station?station.value:'DJX3']);if(vans)vans.textContent=importUpdateText(updates.vans)}
function userCard(u){return'<article class="panel adminUserCard" data-email="'+esc(u.email)+'"><div class="adminUserHead"><div><h3>'+esc(u.name||u.email)+'</h3><p>'+esc(u.email)+'</p></div><span class="badge '+(u.active?'good':'bad')+'">'+(u.active?'Active':'No access')+'</span></div><div class="adminUserFields"><label>Name<input name="name" value="'+esc(u.name)+'"></label><label>Role<select name="role"><option '+(u.role==='Lead'?'selected':'')+'>Lead</option><option '+(u.role==='Admin'?'selected':'')+'>Admin</option></select></label><label>Station access<select name="stationAccess" onchange="syncUserStation(this.closest(\'.adminUserCard\'))"><option '+(u.stationAccess==='DJX3'?'selected':'')+'>DJX3</option><option '+(u.stationAccess==='DJX4'?'selected':'')+'>DJX4</option><option '+(u.stationAccess==='Both'?'selected':'')+'>Both</option></select></label><label>Default station<select name="defaultStation"><option '+(u.defaultStation==='DJX3'?'selected':'')+'>DJX3</option><option '+(u.defaultStation==='DJX4'?'selected':'')+'>DJX4</option></select></label><label class="activeToggle"><input name="active" type="checkbox" '+(u.active?'checked':'')+' '+(u.isSelf?'disabled':'')+'> Active access</label></div><div class="adminUserActions"><button class="secondary" onclick="saveManagedUser(this)">SAVE PERMISSIONS</button><button class="removeUser" onclick="removeUserAccess(this)" '+(u.isSelf?'disabled':'')+'>REMOVE USER</button></div></article>'}
function openInvitePanel(){document.getElementById('invitePanel').hidden=false;document.getElementById('invitePanel').scrollIntoView({behavior:'smooth',block:'start'})}
function closeInvitePanel(){document.getElementById('invitePanel').hidden=true}
function syncInviteStation(f){if(f.elements.stationAccess.value!=='Both')f.elements.defaultStation.value=f.elements.stationAccess.value}
function syncUserStation(card){const scope=card.querySelector('[name=stationAccess]').value;if(scope!=='Both')card.querySelector('[name=defaultStation]').value=scope}
function sendInvitation(e){e.preventDefault();const x=form(e.target),button=e.submitter;button.disabled=true;button.textContent='SENDING…';google.script.run.withSuccessHandler(r=>{button.disabled=false;button.textContent='SEND INVITATION LINK';e.target.reset();closeInvitePanel();toast(r.message);loadAdminData()}).withFailureHandler(err=>{button.disabled=false;button.textContent='SEND INVITATION LINK';toast(err.message||String(err),true)}).createUserInvitation(TOKEN,x)}
function saveManagedUser(button){const card=button.closest('.adminUserCard'),activeInput=card.querySelector('[name=active]'),payload={email:card.dataset.email,name:card.querySelector('[name=name]').value,role:card.querySelector('[name=role]').value,stationAccess:card.querySelector('[name=stationAccess]').value,defaultStation:card.querySelector('[name=defaultStation]').value,active:activeInput.disabled?true:activeInput.checked};button.disabled=true;google.script.run.withSuccessHandler(r=>{button.disabled=false;toast(r.message);ADMIN_LOADING=false;loadAdminData()}).withFailureHandler(e=>{button.disabled=false;toast(e.message||String(e),true)}).updateManagedUser(TOKEN,payload)}
function removeUserAccess(button){const card=button.closest('.adminUserCard'),email=card.dataset.email;if(!confirm('Permanently remove '+email+' from the app?'))return;button.disabled=true;button.textContent='REMOVING…';google.script.run.withSuccessHandler(r=>{card.remove();toast(r.message);ADMIN_LOADING=false;loadAdminData()}).withFailureHandler(e=>{button.disabled=false;button.textContent='REMOVE USER';toast(e.message||String(e),true)}).removeManagedUser(TOKEN,email)}
function readUpload(file){return new Promise((resolve,reject)=>{if(!file)return reject(new Error('Choose a file.'));const reader=new FileReader();reader.onload=()=>resolve({name:file.name,mimeType:file.type||'',base64:String(reader.result).split(',')[1]||''});reader.onerror=()=>reject(new Error('The file could not be read.'));reader.readAsDataURL(file)})}
async function uploadDrivers(e){e.preventDefault();const button=e.submitter,file=e.target.elements.file.files[0];button.disabled=true;button.textContent='VALIDATING…';try{const payload=await readUpload(file);google.script.run.withSuccessHandler(r=>{button.disabled=false;button.textContent='UPDATE DRIVERS';e.target.elements.file.value='';toast(r.message);ADMIN_LOADING=false;loadAdminData();refreshAppData()}).withFailureHandler(err=>{button.disabled=false;button.textContent='UPDATE DRIVERS';toast(err.message||String(err),true)}).importDriversFile(TOKEN,e.target.elements.station.value,payload)}catch(err){button.disabled=false;button.textContent='UPDATE DRIVERS';toast(err.message,true)}}
async function uploadVans(e){e.preventDefault();const button=e.submitter,file=e.target.elements.file.files[0];button.disabled=true;button.textContent='VALIDATING…';try{const payload=await readUpload(file);google.script.run.withSuccessHandler(r=>{button.disabled=false;button.textContent='UPDATE VANS';e.target.elements.file.value='';toast(r.message);ADMIN_LOADING=false;loadAdminData();refreshAppData()}).withFailureHandler(err=>{button.disabled=false;button.textContent='UPDATE VANS';toast(err.message||String(err),true)}).importVansFile(TOKEN,payload)}catch(err){button.disabled=false;button.textContent='UPDATE VANS';toast(err.message,true)}}
function form(f){return Object.fromEntries(new FormData(f).entries())}function fmt(v){if(!v)return'';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString()}function fmtFull(v){const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'})}function statusClass(s){return s==='Operational'?'good':s==='Grounded'?'bad':'warn'}function empty(t){return '<div class="panel meta">'+esc(t)+'</div>'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
