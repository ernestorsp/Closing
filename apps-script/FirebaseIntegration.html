<script>
(function(){
  'use strict';
  const STATE={firebaseUser:null,bootstrap:null,lastError:null,ready:false,currentLock:null,heartbeat:null,wrapperTimer:null,wrapped:{logout:false,spots:false,claim:false}};
  function isEnabled(){return !!(window.AAXI_FIREBASE&&window.AAXI_FIREBASE.enabled())}
  function cloudReady(){return isEnabled()&&!!window.AAXI_FIREBASE.auth.currentUser}
  function report(error){STATE.lastError=error;console.error('[Firebase migration]',error)}
  function inspectionId(){return crypto.randomUUID()}
  function uiSpot(row){return{SpotID:String(row.id||row.spotId||((row.station||'')+'_'+(row.spot||''))),Station:String(row.station||''),Spot:String(row.spot||''),OccupiedByVanID:String(row.vanId||'')}}
  function uiInspection(cloud){
    const i=cloud.inspection||{};
    return{
      inspection:{
        InspectionID:String(i.inspectionId||i.id||''),VanID:String(i.vanId||''),VanNumber:String(i.vanNumber||''),
        UserEmail:String(i.ownerEmail||''),UserName:String(i.ownerName||''),WorkingStation:String(i.workingStation||i.station||''),
        PreviousStation:String(i.previousStation||i.station||''),Station:String(i.station||''),PreviousSpot:String(i.previousSpot||''),Spot:String(i.spot||''),
        PreviousStatus:String(i.previousStatus||i.status||'Operational'),Status:String(i.status||'Operational'),Notes:String(i.notes||''),
        StartedAt:i.startedAt||new Date().toISOString(),PhotoProgress:String((cloud.photos||[]).length)+'/6',InspectionState:i.state==='Completed'?'Completed':'In Progress'
      },
      lastInspection:null,
      photos:(cloud.photos||[]).map(p=>({PhotoID:p.id||p.photoId,Part:p.part,FileURL:p.url||'',CapturedAt:p.createdAt,DamageAssessment:p.assessment||'No Damage',DamageNotes:p.notes||''})),
      damages:(cloud.damages||[]).map(d=>({DamageID:d.id||d.damageId,Part:d.part,Severity:d.severity,PhotoID:d.photoId||'',ReportedAt:d.createdAt})),
      spots:[],requiredParts:['Front','Driver Side','Rear','Passenger Side','Cargo Interior','Cabin Interior'],statuses:['Operational','Downed','Grounded']
    }
  }
  async function signInAlongsideCurrentLogin(email,password){
    if(!isEnabled())return null;
    try{const user=await window.AAXI_FIREBASE.signIn(email,password);STATE.firebaseUser=user;return user}
    catch(error){report(error);return null}
  }
  async function loadCloudBootstrap(station){
    if(!cloudReady())return null;
    const result=await window.AAXI_FIREBASE.bootstrap(station||DATA&&DATA.user&&DATA.user.station||'DJX3');
    STATE.bootstrap=result;
    return result;
  }
  function bindParallelLogin(){
    const form=document.getElementById('loginForm');
    if(!form||form.dataset.firebaseBound==='1')return;
    form.dataset.firebaseBound='1';
    form.addEventListener('submit',function(){
      if(!isEnabled())return;
      const email=String(form.elements.email&&form.elements.email.value||'').trim();
      const password=String(form.elements.password&&form.elements.password.value||'');
      if(email&&password)signInAlongsideCurrentLogin(email,password);
    },true);
  }
  function wrapLogout(){
    if(STATE.wrapped.logout)return true;
    if(typeof window.doLogout!=='function')return false;
    if(window.doLogout._firebaseWrapped){STATE.wrapped.logout=true;return true}
    const original=window.doLogout;
    window.doLogout=function(){stopHeartbeat();STATE.currentLock=null;if(isEnabled())window.AAXI_FIREBASE.signOut().catch(report);return original.apply(this,arguments)};
    window.doLogout._firebaseWrapped=true;STATE.wrapped.logout=true;return true;
  }
  function startHeartbeat(){
    stopHeartbeat();
    STATE.heartbeat=setInterval(async()=>{
      const lock=STATE.currentLock;if(!lock||!cloudReady())return;
      try{await window.AAXI_FIREBASE.renew(lock.vanId,lock.inspectionId)}catch(error){
        report(error);
        if(['LOCK_NOT_OWNED','LOCK_EXPIRED','VAN_LOCKED'].includes(error.code)){
          stopHeartbeat();STATE.currentLock=null;BLOCKED_VANS.add(String(lock.vanId));
          if(typeof toast==='function')toast('The Firebase inspection lock was lost. Reopen the van.',true);
        }
      }
    },90000);
  }
  function stopHeartbeat(){if(STATE.heartbeat)clearInterval(STATE.heartbeat);STATE.heartbeat=null}
  function failClaim(vanId,error){
    INSPECTION_CLAIMING=false;
    const queue=INSPECTION_CLAIM_QUEUE.splice(0),handled=queue.some(item=>typeof item.onFailure==='function');
    if(handled){queue.forEach(item=>{if(typeof item.onFailure==='function')item.onFailure(error)});return}
    const message=error&&error.message||String(error),conflict=['VAN_LOCKED','LOCK_EXPIRED','LOCK_NOT_OWNED'].includes(error&&error.code)||/another user|locked/i.test(message);
    if(conflict)BLOCKED_VANS.add(String(vanId));
    CURRENT=null;PHOTO_UPLOADS.clear();setLocationBusy(false);setBusy(false);showPage('pending');renderVans();toast(conflict?'This van is already being inspected by another user.':message,true);
  }
  function wrapSpotReads(){
    if(STATE.wrapped.spots)return true;
    if(typeof window.refreshAvailableSpots!=='function')return false;
    if(window.refreshAvailableSpots._firebaseWrapped){STATE.wrapped.spots=true;return true}
    const original=window.refreshAvailableSpots;
    window.refreshAvailableSpots=function(vanId,station,selected){
      if(!cloudReady())return original.apply(this,arguments);
      window.AAXI_FIREBASE.spots(station,vanId).then(result=>{
        if(!CURRENT||String(CURRENT.inspection.VanID)!==String(vanId))return;
        const draft=CURRENT.locationDraft||{},currentSelection=String(draft.station)===String(station)?draft.spot:selected;
        applyAvailableSpots((result.spots||[]).map(uiSpot),station,currentSelection);
      }).catch(error=>{report(error);original(vanId,station,selected)});
    };
    window.refreshAvailableSpots._firebaseWrapped=true;STATE.wrapped.spots=true;return true;
  }
  function wrapClaim(){
    if(STATE.wrapped.claim)return true;
    if(typeof window.claimCurrentInspection!=='function')return false;
    if(window.claimCurrentInspection._firebaseWrapped){STATE.wrapped.claim=true;return true}
    const original=window.claimCurrentInspection;
    window.claimCurrentInspection=function(next,onFailure){
      if(!cloudReady())return original.apply(this,arguments);
      if(!CURRENT)return;
      const vanId=String(CURRENT.inspection.VanID||'');
      if(STATE.currentLock&&String(STATE.currentLock.vanId)===vanId)return next();
      INSPECTION_CLAIM_QUEUE.push({next,onFailure});if(INSPECTION_CLAIMING)return;
      INSPECTION_CLAIMING=true;
      const id=inspectionId();
      window.AAXI_FIREBASE.claim(vanId,id).then(()=>window.AAXI_FIREBASE.getInspection(id)).then(async cloud=>{
        INSPECTION_CLAIMING=false;
        if(!CURRENT||String(CURRENT.inspection.VanID)!==vanId){INSPECTION_CLAIM_QUEUE=[];await window.AAXI_FIREBASE.release(vanId).catch(report);return}
        const data=uiInspection(cloud);
        if(data.inspection.Station!=='SHOP'&&data.inspection.Station===data.inspection.WorkingStation){
          try{const spots=await window.AAXI_FIREBASE.spots(data.inspection.Station,vanId);data.spots=(spots.spots||[]).map(uiSpot)}catch(error){report(error)}
        }
        renderInspection(data);STATE.currentLock={vanId,inspectionId:id};startHeartbeat();
        const queue=INSPECTION_CLAIM_QUEUE.splice(0);queue.forEach(item=>item.next());
      }).catch(error=>failClaim(vanId,error));
    };
    window.claimCurrentInspection._firebaseWrapped=true;STATE.wrapped.claim=true;return true;
  }
  function installWrappers(){
    bindParallelLogin();wrapLogout();wrapSpotReads();wrapClaim();
    const complete=STATE.wrapped.logout&&STATE.wrapped.spots&&STATE.wrapped.claim;
    if(complete&&STATE.wrapperTimer){clearInterval(STATE.wrapperTimer);STATE.wrapperTimer=null}
    return complete;
  }
  function beginWrapperRetry(){
    installWrappers();
    if(!STATE.wrapperTimer)STATE.wrapperTimer=setInterval(installWrappers,500);
  }
  async function diagnostics(){
    const result={enabled:isEnabled(),firebaseSignedIn:!!window.AAXI_FIREBASE.auth.currentUser,api:'https://aaxi-closing-api-lexfqgdyea-ue.a.run.app',wrappers:{...STATE.wrapped},currentLock:STATE.currentLock};
    if(result.firebaseSignedIn){try{const cloud=await loadCloudBootstrap();result.cloud={ok:true,vans:(cloud.vans||[]).length,spots:(cloud.spots||[]).length,locks:(cloud.locks||[]).length}}catch(error){result.cloud={ok:false,code:error.code||'',message:error.message};report(error)}}
    console.table(result.cloud||result);return result;
  }
  document.addEventListener('DOMContentLoaded',function(){
    beginWrapperRetry();
    window.AAXI_FIREBASE.onAuthChanged(async user=>{
      STATE.firebaseUser=user||null;STATE.ready=true;beginWrapperRetry();
      if(user&&isEnabled()&&DATA&&DATA.user){try{await loadCloudBootstrap(DATA.user.station)}catch(error){report(error)}}
    });
  });
  window.AAXI_FIREBASE_INTEGRATION={STATE,isEnabled,setEnabled:value=>window.AAXI_FIREBASE.setEnabled(value),signInAlongsideCurrentLogin,loadCloudBootstrap,installWrappers,diagnostics};
})();
</script>
